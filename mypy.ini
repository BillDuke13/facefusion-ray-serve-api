[mypy]
check_untyped_defs = True
disallow_any_generics = True
disallow_untyped_calls = True
disallow_untyped_defs = True
ignore_missing_imports = True
strict_optional = False
# Vendored upstream FaceFusion and its launcher shims are not part of this gate;
# tests are exercised by pytest, not the strict type gate.
exclude = (?x)(^facefusion/|^facefusion\.py$|^install\.py$|^tests/)

[mypy-facefusion.*]
follow_imports = skip
ignore_errors = True
